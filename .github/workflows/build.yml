name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A1D671: ${{ secrets.A1D671 }}
          B27EC5: ${{ secrets.B27EC5 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A1D671', '')
          tag_b = os.environ.get('B27EC5', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- de3791f11c001746da028c99f980bc6b78f2228ecbb10a85 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- ddcbda59e690b558af78b8 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
